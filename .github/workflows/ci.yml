name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The hook for the web UI's "Create a new release" button — it fires on Publish,
  # and covers `gh release create` and the REST API too. A tag-push trigger would
  # miss a release pointed at a tag that already existed, since nothing is pushed
  # in that case.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per OS rather than a lint job plus a bundle job: every path here needs
  # the real sidecar anyway (build.rs refuses to run without it), so splitting
  # would download the same ~120 MB SEA binary twice per runner.
  build:
    name: build (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        # Each runner downloads the host SEA and builds the tray bundle. The two
        # macOS legs produce separate arm64 and Intel DMGs.
        include:
          - runner: macos-latest
            triple: aarch64-apple-darwin
          - runner: macos-15-intel
            triple: x86_64-apple-darwin
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        # Uniform shell across runners; Windows would otherwise default to pwsh.
        shell: bash
    steps:
      # --- sidecar prerequisites ------------------------------------------------

      - name: Check out proxy_tray
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The staging script selects the latest published asset for the host triple.
      # On Windows it also extracts keytar.node and its license from the ZIP.
      # tauri_build::build() requires these files before any cargo command.
      - name: Download and stage the model_proxy_v3 release
        run: |
          bash scripts/stage-sidecar.sh
          ls -l src-tauri/binaries/

      # The expected name also proves the host runner matches the matrix triple.
      # A status.get reply exercises the packaged Node runtime and the tray's RPC
      # transport, not merely the presence of a file.
      - name: Verify the staged sidecar
        run: |
          expected="src-tauri/binaries/model-proxy-v3-${{ matrix.triple }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            expected="$expected.exe"
          fi
          if [ ! -f "$expected" ]; then
            echo "::error::expected staged sidecar $expected"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            for companion in keytar.node keytar-LICENSE.md; do
              if [ ! -s "src-tauri/binaries/$companion" ]; then
                echo "::error::missing or empty Windows companion: $companion"
                exit 1
              fi
            done
          fi
          config="$RUNNER_TEMP/proxy-tray-ci-config.toml"
          : > "$config"
          response="$(printf '%s\n' '{"jsonrpc":"2.0","method":"status.get","params":{},"id":1}' | PORT=0 PROXY_CONFIG_PATH="$config" "$expected" --rpc)"
          rm -f "$config"
          printf '%s\n' "$response"
          case "$response" in
            *'"running":true'*) ;;
            *) echo "::error::sidecar did not answer status.get"; exit 1 ;;
          esac

      # --- checks ---------------------------------------------------------------

      # Formatting is a property of the source, so one OS is enough.
      - name: cargo fmt
        if: matrix.triple == 'aarch64-apple-darwin'
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # --- bundles --------------------------------------------------------------

      - name: Build bundles
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # proxy_tray has no root package.json and no @tauri-apps/cli dependency,
          # so with this unset the action falls back to `npm install -g
          # @tauri-apps/cli@v2`. Naming the runner keeps the CLI version ours.
          tauriScript: npx --yes @tauri-apps/cli@^2
          # Empty on push/workflow_dispatch: build the bundles without creating or
          # touching a release. On a published release this is the tag the web UI
          # just made, and the action attaches the bundles to it.
          tagName: ${{ github.event.release.tag_name || '' }}

      - name: Upload bundles
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: proxy-tray-${{ matrix.triple }}
          # The .app is deliberately not listed: upload-artifact does not preserve
          # permissions or symlinks, so a .app comes back broken. The .dmg wraps
          # it intact.
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
