<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model Proxy V3 (Panel)</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .export-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        font-size: 13px;
        color: var(--muted, #888);
        background: var(--bg-secondary, #eee);
        border: 0px solid var(--border, #ccc);
        border-radius: 6px;
        height: 36px;
      }
      .export-label .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot stopped"></span>
      <div>
        <strong id="headline">Stopped</strong>
        <span id="endpoint" class="muted"></span>
      </div>
    </header>

    <p id="error" class="error" hidden></p>

    <section class="stats">
      <div><span id="active">—</span><label>active requests</label></div>
      <div><span id="tokens">—</span><label>tokens (24h)</label></div>
      <div><span id="models">—</span><label>models</label></div>
    </section>

    <section class="row">
      <button id="toggle">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Start
      </button>
      <button id="restart">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M21 12a9 9 0 1 1-9 9 9.75 9.75 0 0 1 6.74-2.74L21 16"/></svg>
        Restart
      </button>
      <span class="btn-separator">|</span>
      <button id="reload">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Reload config
      </button>
      <button id="dashboard">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Open dashboard
      </button>
    </section>

    <section>
      <h2>Config</h2>
      <code id="config-path" class="path"></code>
      <p id="config-note" class="note" hidden></p>
      <p id="reload-error" class="error" hidden></p>
    </section>

    <section>
      <div class="section-head">
        <h2>Models</h2>
        <div class="head-actions">
          <button id="models-refresh" class="mini">Refresh</button>
        </div>
      </div>
      <div class="model-select-row">
        <select id="model-select" class="model-select" disabled multiple>
          <option value="">Choose one or more models …</option>
        </select>
        <div class="model-side">
          <button id="test-model" class="mini" disabled>Test now</button>
          <label class="pin-row" title="Started by the Test now button">
            <input type="checkbox" id="pin-test" />
            Pin 300s
          </label>
        </div>
      </div>
      <pre id="model-test-result" class="empty" hidden></pre>
    </section>

    <section class="row">
      <label class="export-label">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export for :
      </label>
      <button id="export-pi">
        Pi
      </button>
      <button id="export-openclaw">
        OpenClaw
      </button>
      <button id="export-dsh">
        DSH
      </button>
    </section>

    <section>
      <div class="section-head">
        <h2>Export output</h2>
        <div class="head-actions">
          <button id="export-copy" class="mini">Copy</button>
          <button id="export-clear" class="mini">Clear</button>
        </div>
      </div>
      <pre id="export-output" class="empty">No export yet.</pre>
    </section>

    <section>
      <div class="section-head">
        <h2>Log</h2>
        <div class="head-actions">
          <button id="log-copy" class="mini">Copy</button>
          <button id="log-clear" class="mini">Clear</button>
        </div>
      </div>
      <pre id="log" class="empty">No log yet.</pre>
    </section>

    <script src="app.js"></script>
  </body>
</html>
